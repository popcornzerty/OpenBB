[package]
name = "pea-terminal"
version = "0.1.0"
description = "Terminal d'investissement pour actions européennes éligibles au PEA"
authors = ["popcornzerty"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "pea_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
