[package]
name = "pea-terminal"
version = "0.1.0"
description = "Terminal d'investissement pour actions européennes éligibles au PEA"
authors = ["popcornzerty"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "pea_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Objet de travail Windows : lie le backend au cycle de vie de l'application,
# y compris lorsque celle-ci est tuée sans pouvoir exécuter son code de sortie.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    # CreateJobObjectW prend des attributs de sécurité : sans cette feature,
    # la fonction n'est pas compilée dans la crate.
    "Win32_Security",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
